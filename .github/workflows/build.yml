#
# Compila el mod igual que el proyecto de Half-Life: descarga el MDK oficial de Forge 1.12.2,
# copia el src/ del repo dentro del MDK y usa el gradlew del propio MDK.
name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Pruebas del nucleo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Ejecutar pruebas
        run: bash tools/smoke-test.sh

  build:
    name: Compilar el mod (MDK de Forge 1.12.2)
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Descargar el MDK de Forge 1.12.2
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip
          mkdir mdk && unzip -q mdk.zip -d mdk
          ls -la mdk

      - name: Poner el codigo del mod dentro del MDK
        run: |
          rm -rf mdk/src
          mkdir -p mdk/src
          cp -r src/. mdk/src/
          echo "Archivos .java en el MDK: $(find mdk/src -name '*.java' | wc -l)"
          sed -i 's/^version = .*/version = "1.0.0"/; s/^group = .*/group = "com.videoblocks"/; s/^archivesBaseName = .*/archivesBaseName = "VideoBlocks-1.12.2"/' mdk/build.gradle
          grep -nE '^(version|group|archivesBaseName)' mdk/build.gradle

      - name: Compilar
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Mostrar contenido del jar
        run: |
          ls -la mdk/build/libs
          for f in mdk/build/libs/*.jar; do echo "== $f"; unzip -l "$f" | tail -15; done

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: VideoBlocks-jar
          path: mdk/build/libs/*.jar

  release:
    name: Publicar release
    needs: [core-tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoBlocks-jar
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
